<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Login - Like4Like</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        .btn { background: #3b82f6; color: white; padding: 10px; border: none; border-radius: 6px; width: 100%; font-size: 15px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #2563eb; }
        .forgot-btn { background: none; border: none; color: #38bdf8; font-size: 13px; cursor: pointer; padding: 0; margin-top: 10px; text-decoration: underline; width: 100%; text-align: center; }
        .forgot-btn:hover { color: #60a5fa; }
        #error-msg { color: #ef4444; font-size: 13px; text-align: center; margin-top: 10px; }
        #success-msg { color: #4ade80; font-size: 13px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 Website Login</h2>
        <label>Telegram ID or Gmail:</label>
        <input type="text" id="loginIdentifier" placeholder="Enter telegram id or gmail">
        
        <label>Password:</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
        
        <button class="btn" onclick="webLogin()">Login</button>
        <button class="forgot-btn" onclick="forgotPassword()">Forgot Password?</button>
        
        <p id="error-msg"></p>
        <p id="success-msg"></p>
    </div>

    <script>
        const SERVER_URL = "https://telegram-mini-app-8y39.onrender.com";

        async function webLogin() {
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.innerText = "";
            successMsg.innerText = "";

            if (!identifier || !password) {
                errorMsg.innerText = "Please fill in all fields!";
                return;
            }

            const requestBody = identifier.includes('@') 
                ? { identifier, password } 
                : { telegramId: identifier, password };

            try {
                const res = await fetch(`${SERVER_URL}/api/website-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();

                if (data.success) {
                    alert("Login Successful!");
                    localStorage.setItem('telegramId', data.user.telegramId);
                    window.location.href = "index.html"; 
                } else {
                    errorMsg.innerText = data.error || "Invalid credentials!";
                }
            } catch (err) {
                errorMsg.innerText = "Server connection error!";
            }
        }

        async function forgotPassword() {
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.innerText = "";
            successMsg.innerText = "";

            if (!identifier) {
                errorMsg.innerText = "Please enter your Telegram ID or Gmail first!";
                return;
            }

            // ফিক্সড: ব্যাকএন্ডের সাথে মিল রেখে identifier পাঠানো হচ্ছে
            const requestBody = { identifier: identifier };

            try {
                successMsg.innerText = "Sending new password...";
                const res = await fetch(`${SERVER_URL}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();

                if (data.success) {
                    successMsg.innerText = "A new temporary password has been sent to your Gmail / Telegram!";
                } else {
                    errorMsg.innerText = data.error || "Failed to reset password!";
                    successMsg.innerText = "";
                }
            } catch (err) {
                errorMsg.innerText = "Server connection error!";
                successMsg.innerText = "";
            }
        }
    </script>
</body>
</html>
